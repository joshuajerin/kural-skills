[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "kural-skills"
version = "0.1.0"
description = "Small callable robot skills for Kural"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]

[project.scripts]
kural-skills = "kural_skills.cli:main"
kural-skills-mcp = "kural_skills.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
