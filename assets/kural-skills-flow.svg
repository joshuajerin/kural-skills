<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Kural Skills dry-run request flow</title>
  <desc id="desc">An agent request passes through a bounded catalog and validation gate to a dry-run result. The live robot boundary remains locked.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset=".5" stop-color="#101b35"/><stop offset="1" stop-color="#09161a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#47d7ff"/><stop offset="1" stop-color="#8d6bff"/></linearGradient>
    <linearGradient id="safe" x1="0" x2="1"><stop stop-color="#43e3a5"/><stop offset="1" stop-color="#2ebc7f"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8db3ff" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="96" cy="54" r="110" fill="#2868ff" opacity=".12"/><circle cx="1110" cy="304" r="160" fill="#2ee3a5" opacity=".08"/>
  <text x="58" y="66" fill="#eff6ff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Kural Skills</text>
  <text x="58" y="96" fill="#aabbd6" font-family="Arial, Helvetica, sans-serif" font-size="16">A bounded request layer for people, programs, and agents.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(58 150)">
      <rect width="218" height="116" rx="17" fill="#111f3b" stroke="#3c5f98"/>
      <circle cx="35" cy="37" r="16" fill="url(#accent)" opacity=".95"/>
      <path d="M28 38h14M35 31v14" stroke="#07111f" stroke-width="3" stroke-linecap="round"/>
      <text x="63" y="34" fill="#eff6ff" font-size="17" font-weight="700">Intent</text>
      <text x="20" y="78" fill="#aabbd6" font-size="14">Python · CLI · MCP</text>
      <text x="20" y="100" fill="#7188ac" font-size="13">one bounded request</text>
    </g>
    <path d="M294 208h76" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path d="m362 200 15 8-15 8" fill="none" stroke="#8d6bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(392 150)">
      <rect width="240" height="116" rx="17" fill="#111f3b" stroke="#3c5f98"/>
      <path d="M31 25h28l7 9v28l-7 9H31l-7-9V34z" fill="none" stroke="#47d7ff" stroke-width="3"/>
      <path d="m35 48 8 8 15-17" fill="none" stroke="#47d7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="85" y="34" fill="#eff6ff" font-size="17" font-weight="700">Catalog + validation</text>
      <text x="20" y="78" fill="#aabbd6" font-size="14">18 skills · units · bounds</text>
      <text x="20" y="100" fill="#7188ac" font-size="13">unknown and unsafe inputs reject</text>
    </g>
    <path d="M650 208h76" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path d="m718 200 15 8-15 8" fill="none" stroke="#8d6bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(748 150)">
      <rect width="216" height="116" rx="17" fill="#102a2c" stroke="#3fa886"/>
      <circle cx="40" cy="44" r="22" fill="none" stroke="url(#safe)" stroke-width="4"/>
      <path d="M30 44h20M40 34v20" stroke="#43e3a5" stroke-width="3" stroke-linecap="round"/>
      <text x="79" y="34" fill="#effff8" font-size="17" font-weight="700">Dry-run result</text>
      <text x="20" y="78" fill="#b7e8d5" font-size="14">validated intent only</text>
      <text x="20" y="100" fill="#79af9d" font-size="13">no robot motion</text>
    </g>
    <path d="M982 208h42" stroke="#f0a44c" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
    <g transform="translate(1040 156)">
      <rect width="103" height="104" rx="16" fill="#2a1c1e" stroke="#c46e67"/>
      <path d="M40 48V34a12 12 0 0 1 24 0v14M34 48h36v29H34z" fill="none" stroke="#ff9389" stroke-width="3" stroke-linejoin="round"/>
      <text x="52" y="93" text-anchor="middle" fill="#ffb6ae" font-size="12" font-weight="700">LIVE</text>
    </g>
  </g>
  <text x="1040" y="292" fill="#d79a94" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">separate gateway required</text>
  <text x="58" y="324" fill="#6f84a8" font-family="Arial, Helvetica, sans-serif" font-size="13">Dry run is an honest boundary — not a simulation or hardware claim.</text>
</svg>
